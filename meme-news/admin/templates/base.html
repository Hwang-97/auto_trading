<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MemeNews Admin{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --sidebar-width: 250px;
        }
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: var(--sidebar-width);
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 1rem;
            z-index: 1000;
        }
        .sidebar .brand {
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 1rem 0;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            margin-bottom: 1rem;
        }
        .sidebar .nav-link {
            color: rgba(255,255,255,0.8);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin-bottom: 0.25rem;
            transition: all 0.2s;
        }
        .sidebar .nav-link:hover {
            color: white;
            background: rgba(255,255,255,0.1);
        }
        .sidebar .nav-link.active {
            color: white;
            background: rgba(255,255,255,0.2);
        }
        .sidebar .nav-link i {
            margin-right: 0.75rem;
        }
        .main-content {
            margin-left: var(--sidebar-width);
            padding: 2rem;
            min-height: 100vh;
            background: #f8f9fa;
        }
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        .card-header {
            background: white;
            border-bottom: 1px solid #eee;
            font-weight: 600;
        }
        .stat-card {
            border-radius: 12px;
            padding: 1.5rem;
            color: white;
        }
        .stat-card.primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .stat-card.success { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); }
        .stat-card.warning { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .stat-card.info { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #5a6fd6 0%, #6a4190 100%);
        }
        .user-badge {
            color: rgba(255,255,255,0.8);
            font-size: 0.875rem;
            padding: 1rem;
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            border-top: 1px solid rgba(255,255,255,0.2);
        }
        .alert-warning-password {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% if user %}
    <nav class="sidebar">
        <div class="brand">
            <i class="bi bi-emoji-laughing"></i> MemeNews
        </div>
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link {% if page == 'dashboard' %}active{% endif %}" href="/">
                    <i class="bi bi-speedometer2"></i> 대시보드
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if page == 'generate' %}active{% endif %}" href="/generate">
                    <i class="bi bi-play-circle"></i> 콘텐츠 생성
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if page == 'scheduler' %}active{% endif %}" href="/scheduler">
                    <i class="bi bi-calendar-check"></i> 스케줄러
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if page == 'output' %}active{% endif %}" href="/output">
                    <i class="bi bi-folder"></i> 생성된 콘텐츠
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if page == 'logs' %}active{% endif %}" href="/logs">
                    <i class="bi bi-journal-text"></i> 로그
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if page == 'settings' %}active{% endif %}" href="/settings">
                    <i class="bi bi-gear"></i> 설정
                </a>
            </li>
        </ul>
        <div class="user-badge">
            <i class="bi bi-person-circle"></i> {{ user }}
            <a href="/logout" class="text-white float-end"><i class="bi bi-box-arrow-right"></i></a>
        </div>
    </nav>
    {% endif %}

    <main class="{% if user %}main-content{% endif %}">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
