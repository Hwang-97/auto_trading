{% extends "base.html" %}

{% block title %}콘텐츠 생성 - MemeNews Admin{% endblock %}

{% block content %}
<div class="container-fluid">
    <h2 class="mb-4">콘텐츠 생성</h2>

    <div class="row">
        {% for channel in channels %}
        <div class="col-md-4 mb-4">
            <div class="card h-100">
                <div class="card-header">
                    <i class="bi bi-broadcast me-2"></i>{{ channel.name }}
                </div>
                <div class="card-body">
                    <p class="text-muted">카테고리: {{ channel.category }}</p>
                    <p class="mb-3">
                        <strong>플랫폼:</strong><br>
                        {% for platform in channel.platforms %}
                        <span class="badge bg-secondary me-1">{{ platform }}</span>
                        {% endfor %}
                    </p>

                    <div class="d-grid gap-2">
                        <button class="btn btn-primary" onclick="runChannel('{{ channel.id }}', false)">
                            <i class="bi bi-play-fill me-2"></i>생성 및 업로드
                        </button>
                        <button class="btn btn-outline-secondary" onclick="runChannel('{{ channel.id }}', true)">
                            <i class="bi bi-eye me-2"></i>테스트 (Dry Run)
                        </button>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>

    <!-- 결과 모달 -->
    <div class="modal fade" id="resultModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">생성 결과</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="resultContent"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
async function runChannel(channelId, dryRun) {
    const btn = event.target;
    const originalText = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>생성중...';

    try {
        const response = await fetch(`/generate/${channelId}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/x-www-form-urlencoded'},
            body: `dry_run=${dryRun}`
        });
        const result = await response.json();

        const modal = new bootstrap.Modal(document.getElementById('resultModal'));
        const content = document.getElementById('resultContent');

        if (result.success) {
            content.innerHTML = `
                <div class="alert alert-success">
                    <i class="bi bi-check-circle me-2"></i>
                    ${dryRun ? '테스트 완료!' : '콘텐츠가 생성되었습니다!'}
                </div>
                <pre class="bg-light p-3 rounded">${JSON.stringify(result.result, null, 2)}</pre>
            `;
        } else {
            content.innerHTML = `
                <div class="alert alert-danger">
                    <i class="bi bi-x-circle me-2"></i>오류가 발생했습니다.
                </div>
                <p>${result.error}</p>
            `;
        }
        modal.show();
    } catch (e) {
        alert('요청 실패: ' + e.message);
    } finally {
        btn.disabled = false;
        btn.innerHTML = originalText;
    }
}
</script>
{% endblock %}
