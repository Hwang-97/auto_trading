# 채널 설정

channels:
  # 일상밈공장 - 일상 카테고리
  daily_meme:
    name: "일상밈공장"
    description: "직장인, 대학생, 일상에서 공감되는 밈 콘텐츠"
    category: "daily"
    enabled: true

    # 플랫폼 설정
    platforms:
      - youtube
      - tiktok

    # 스케줄 설정
    schedule:
      count: 5  # 하루 5개
      times:
        - "09:00"
        - "12:00"
        - "15:00"
        - "18:00"
        - "21:00"

    # 콘텐츠 설정
    content:
      type: "ai_generated"  # AI 생성
      style: "relatable"    # 공감형
      tone: "humorous"      # 유머러스
      target_audience: "MZ세대"

    # 계정 정보
    accounts:
      youtube:
        channel_id: ""      # 환경변수에서 설정
        channel_name: "일상밈공장"
      tiktok:
        username: ""
        display_name: "일상밈공장"

  # 오늘의밈 - 트렌드 카테고리
  trend_meme:
    name: "오늘의밈"
    description: "실시간 트렌드와 이슈를 밈으로 전달"
    category: "trend"
    enabled: true

    platforms:
      - youtube
      - tiktok
      - instagram

    schedule:
      count: 3  # 하루 3개
      times:
        - "10:00"
        - "14:00"
        - "20:00"

    content:
      type: "trend_based"   # 트렌드 기반
      style: "reactive"     # 반응형
      tone: "witty"         # 위트있게
      target_audience: "전연령"

    accounts:
      youtube:
        channel_id: ""
        channel_name: "오늘의밈"
      tiktok:
        username: ""
        display_name: "오늘의밈"
      instagram:
        username: ""
        display_name: "오늘의밈"

  # IT밈 - IT 카테고리
  it_meme:
    name: "IT밈"
    description: "개발자, IT업계 종사자를 위한 테크 밈"
    category: "it"
    enabled: true

    platforms:
      - youtube
      - tiktok

    schedule:
      count: 2  # 하루 2개
      times:
        - "11:00"
        - "19:00"

    content:
      type: "news_based"    # 뉴스 기반
      style: "nerdy"        # 너드한 스타일
      tone: "sarcastic"     # 약간의 비꼼
      target_audience: "개발자/IT종사자"

    accounts:
      youtube:
        channel_id: ""
        channel_name: "IT밈"
      tiktok:
        username: ""
        display_name: "IT밈"

# 공통 설정
defaults:
  language: "ko"

  # 콘텐츠 품질 설정
  quality:
    min_score: 0.7        # 최소 품질 점수
    retry_count: 3        # 재생성 시도 횟수

  # 업로드 설정
  upload:
    retry_count: 3
    retry_delay: 60       # 초

  # 해시태그
  common_hashtags:
    - "#밈"
    - "#meme"
    - "#shorts"
